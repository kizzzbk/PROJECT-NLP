# ============================================================
# BiLSTM + Attention Model Configuration
# ============================================================

model:
  name: "bilstm_attention"
  architecture: "BiLSTM_Attention"
  description: "Bidirectional LSTM with Attention mechanism for explainable sentiment"
  
  # Embedding
  embedding_dim: 300
  pretrained_embedding: null
  freeze_embedding: false
  
  # LSTM
  hidden_dim: 256
  num_layers: 2
  bidirectional: true
  dropout: 0.3
  lstm_dropout: 0.2
  
  # Attention mechanism
  attention:
    type: "additive"               # "additive" (Bahdanau) | "dot" | "scaled_dot"
    attention_dim: 128             # Hidden dim for attention scoring (additive only)
    return_weights: true           # Must be true for heatmap visualization
    normalize: "softmax"           # "softmax" | "sparsemax"
  
  # Classifier head
  fc_hidden_dim: 128
  num_classes: 2

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 1.0e-5
  
  # Learning rate scheduler
  scheduler: "reduce_on_plateau"
  scheduler_patience: 3
  scheduler_factor: 0.5
  min_lr: 1.0e-6
  
  # Early stopping
  early_stopping: true
  patience: 2
  monitor: "val_f1"
  mode: "max"
  
  # Gradient clipping
  max_grad_norm: 5.0
  
  # Checkpointing
  save_top_k: 3
  save_last: true
  
  # Logging
  log_every_n_steps: 50
  val_check_interval: 1.0
