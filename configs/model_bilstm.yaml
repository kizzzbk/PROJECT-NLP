# ============================================================
# BiLSTM Model Configuration
# ============================================================

model:
  name: "bilstm"
  architecture: "BiLSTM"
  description: "Bidirectional LSTM baseline for sentiment classification"
  
  # Embedding
  embedding_dim: 300
  pretrained_embedding: null       # Path to pre-trained vectors (Word2Vec/FastText)
  freeze_embedding: false
  
  # LSTM
  hidden_dim: 256
  num_layers: 2
  bidirectional: true
  dropout: 0.3
  lstm_dropout: 0.2                # Dropout between LSTM layers
  
  # Classifier head
  fc_hidden_dim: 128
  num_classes: 2
  
  # Pooling strategy
  pooling: "max_mean"              # "max" | "mean" | "max_mean" | "last_hidden"

training:
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  optimizer: "adam"                 # "adam" | "adamw" | "sgd"
  weight_decay: 1.0e-5
  
  # Learning rate scheduler
  scheduler: "reduce_on_plateau"   # "reduce_on_plateau" | "cosine" | "step" | null
  scheduler_patience: 3
  scheduler_factor: 0.5
  min_lr: 1.0e-6
  
  # Early stopping
  early_stopping: true
  patience: 2
  monitor: "val_f1"                # Metric to monitor
  mode: "max"                      # "max" (for f1/acc) | "min" (for loss)
  
  # Gradient clipping
  max_grad_norm: 5.0
  
  # Checkpointing
  save_top_k: 3
  save_last: true
  
  # Logging
  log_every_n_steps: 50
  val_check_interval: 1.0          # Validate every N epochs (1.0 = every epoch)
