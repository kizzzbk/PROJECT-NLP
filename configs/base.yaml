# ============================================================
# Base Configuration — Shared Defaults
# ============================================================

project:
  name: "brandhealth-ai"
  version: "1.0.0"
  description: "Brand Health Monitoring from Customer Feedback using Deep Learning"
  seed: 42
  device: "auto"  # "auto" | "cuda" | "cpu"

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  vocab_dir: "data/vocab"
  model_dir: "models"
  experiment_dir: "experiments"
  teencode_dict: "data/teencode_dict.json"

data:
  max_seq_length: 256
  test_size: 0.2
  val_size: 0.1
  batch_size: 32
  num_workers: 4
  pin_memory: true

labels:
  positive: 1
  negative: 0
  label_names:
    0: "Tiêu cực"
    1: "Tích cực"

logging:
  level: "INFO"
  format: "rich"  # "rich" | "standard"
  log_to_file: true
  log_dir: "logs"
